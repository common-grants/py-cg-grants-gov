name: "CI - Plugin: Run Checks"

on:
  pull_request:
    paths:
      - "cg_grants_gov/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "tests/**"
      - ".github/workflows/ci-plugin.yml"

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      #Checks that the commit message follows the conventional commits spec for release please
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: Gr1N/setup-poetry@v9

      # poetry.lock pins the SDK at the published range's minimum (keep it
      # there), so this job also covers the oldest supported release.
      - name: Install dependencies
        run: make install

      - name: Check the locked SDK is the supported minimum
        run: |
          poetry run python - <<'EOF'
          import re
          import sys
          import tomllib
          from importlib.metadata import version

          with open("pyproject.toml", "rb") as f:
              spec = tomllib.load(f)["tool"]["poetry"]["dependencies"]["common-grants-sdk"]
          match = re.fullmatch(r">=\s*(\S+)", spec)
          if not match:
              sys.exit(f"Expected a '>=' floor for common-grants-sdk, found {spec!r}")
          floor, installed = match.group(1), version("common-grants-sdk")
          if installed != floor:
              sys.exit(
                  f"poetry.lock installs common-grants-sdk {installed}, but the floor in "
                  f"pyproject.toml is {floor}. Lock the SDK at the floor so CI tests it."
              )
          print(f"common-grants-sdk {installed} matches the pyproject.toml floor")
          EOF

      - name: Run checks
        run: make checks

      - name: Run tests
        run: make test

      - name: Build package
        run: make build
